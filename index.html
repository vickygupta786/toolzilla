<!DOCTYPE html>
<html>
<head>
  <title>ToolZilla - Free Tools</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #0f172a;
      color: white;
      text-align: center;
    }

    h1 {
      padding: 20px;
    }

    .container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
    }

    .card {
      background: #1e293b;
      margin: 10px;
      padding: 20px;
      border-radius: 15px;
      width: 250px;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
    }

    button {
      padding: 10px;
      border: none;
      background: #38bdf8;
      color: black;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 10px;
    }

    button:hover {
      background: #0ea5e9;
    }
  </style>
</head>

<body>

<h1>🚀 ToolZilla - Free Online Tools</h1>

<div class="container">

  <div class="card">
    <h3>📸 Image Compressor</h3>
    <button onclick="window.open('https://tinypng.com')">Use Now</button>
  </div>

  <div class="card">
    <h3>📄 PDF Tools</h3>
    <button onclick="window.open('https://ilovepdf.com')">Use Now</button>
  </div>

  <div class="card">
    <h3>📥 Insta Downloader</h3>
    <button onclick="window.open('https://igram.io')">Use Now</button>
  </div>

  <div class="card">
    <h3>🤖 AI Text Tool</h3>
    <button onclick="window.open('https://chat.openai.com')">Use Now</button>
  </div>

</div>

</body>
</html>
